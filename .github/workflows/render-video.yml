name: Render video

# Hosted rendering: push a project folder (script.md + voiceover + media) or
# run this workflow by hand with the project name, and GitHub's runner does the
# transcription, alignment and render. The finished videos are attached to
# the run as downloadable artifacts (kept 14 days).

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder under video-pipeline/projects"
        required: true
        default: "jurassic-park"
      vertical:
        description: "Also render a full 9:16 copy of the long video (the Shorts are rendered either way)"
        type: boolean
        default: false
      shorts_only:
        description: "Only cut and render the Shorts (shorts.json), not the main video"
        type: boolean
        default: false
      footage_only:
        description: "Only find the footage and publish footage-check.png (three frames a clip) to look at before the long render"
        type: boolean
        default: false
      no_shorts:
        description: "Leave the Shorts alone: re-render only the long video (its Shorts are already out)"
        type: boolean
        default: false
      sheet:
        description: "Render the project's one-sheet version (remotion/src/sheet) and publish it to the release, not the storyboard video"
        type: boolean
        default: false
  # a recording on its own is transcribed by transcribe.yml (minutes); the video is rendered when the script ships
  push:
    paths:
      - "video-pipeline/projects/**/script.md"
      - "video-pipeline/projects/**/shorts.json"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    # a merge commit made by pulling before a push carries no [skip ci] of its own, and it started 55-minute
    # renders nobody asked for (twice, on the retirement video): only a real script or Shorts change renders
    if: github.event.inputs.sheet != 'true' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge '))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: video-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the project
        id: pick
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.project }}" ]; then
            echo "project=${{ github.event.inputs.project }}" >> "$GITHUB_OUTPUT"
          else
            # the most recently changed project folder in this push (before-sha may be unknown on a new branch)
            base="${{ github.event.before }}"
            git cat-file -e "$base" 2>/dev/null || base="HEAD~1"
            git cat-file -e "$base" 2>/dev/null || base="$(git hash-object -t tree /dev/null)"
            # of the projects touched by this push, the one whose last commit is newest
            p=""; newest=0
            for q in $(git diff --name-only "$base" HEAD -- . | sed -n 's#^video-pipeline/projects/\([^/]*\)/.*#\1#p' | sort -u); do
              t=$(git log -1 --format=%ct -- "video-pipeline/projects/$q" 2>/dev/null || echo 0)
              if [ "${t:-0}" -ge "$newest" ]; then newest=$t; p=$q; fi
            done
            echo "project=${p:-jurassic-park}" >> "$GITHUB_OUTPUT"
            # a push that changes the Shorts list but not the script only needs the Shorts, not the whole video again
            changed=$(git diff --name-only "$base" HEAD -- "projects/${p:-none}")
            if echo "$changed" | grep -q '/shorts.json$' && ! echo "$changed" | grep -q '/script.md$'; then
              echo "shorts_only=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-pipeline/remotion/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-pipeline/requirements.txt

      - name: ffmpeg (Ubuntu package first with short timeouts; a stable static build as the fallback)
        timeout-minutes: 16
        run: bash scripts/install-ffmpeg.sh

      - name: Install
        run: |
          pip install -r requirements.txt yt-dlp
          cd remotion && npm ci && npx remotion browser ensure

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Find free-use footage for scenes that have none
        timeout-minutes: 10
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m pipeline.find_footage "projects/$PROJECT" || echo "footage finder failed; rendering with fallbacks"

      - name: Fill in real figures and headlines (fact= on stat scenes, [news] scenes)
        timeout-minutes: 5
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
        run: python -m pipeline.find_facts "projects/$PROJECT" || echo "facts step failed; the board keeps what the script says"

      - name: Render
        if: github.event.inputs.footage_only != 'true'
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
        run: |
          flags=""
          # a full vertical copy of a 10-minute video doubles the render; the Shorts already cover 9:16
          if [ "${{ github.event.inputs.vertical }}" = "true" ]; then flags="--vertical"; fi
          if [ "${{ github.event.inputs.shorts_only }}" = "true" ] || [ "${{ steps.pick.outputs.shorts_only }}" = "true" ]; then flags="--only-shorts"; fi
          if [ "${{ github.event.inputs.no_shorts }}" = "true" ]; then flags="$flags --no-shorts"; fi
          python -m pipeline.build "projects/$PROJECT" --model base.en --concurrency 2 $flags

      - name: Keep what the run found (script with credits, report, small media) on the branch
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          # uploads from the studio arrive as <name>.b64 (big ones in pieces under uploads/); the build decoded them,
          # so keep the real file and drop the text copies
          git rm -r -q --ignore-unmatch "projects/$PROJECT/uploads" 2>/dev/null || true
          rm -rf "projects/$PROJECT/uploads"
          find "projects/$PROJECT/media" -name '*.b64' -exec git rm -q --ignore-unmatch {} + 2>/dev/null || true
          find "projects/$PROJECT/media" -name '*.b64' -delete 2>/dev/null || true
          find "projects/$PROJECT/media" -type f -size -40M \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.gif' -o -name '*.webp' -o -name '*.webm' -o -name '*.mp4' -o -name '*.mov' \) -exec git add -f {} +
          # a recording sent from the studio: keep the decoded voice (it replaced any older one), drop the text copy
          if ls "projects/$PROJECT"/voiceover.*.b64 >/dev/null 2>&1; then
            git rm -q --ignore-unmatch "projects/$PROJECT"/voiceover.*.b64
            rm -f "projects/$PROJECT"/voiceover.*.b64
            find "projects/$PROJECT" -maxdepth 1 -name 'voiceover.*' -size -40M -exec git add -f {} +
            git add -u "projects/$PROJECT" 2>/dev/null || true
          fi
          # the script (built from the voice when there was none), the transcript and the timings, for the studio
          # one at a time: a single missing file (no timing.json on a silent render) made git add refuse the lot,
          # and the script lost the footage and figures the run had written into it
          for f in script.md footage-report.md facts-report.md credits.txt footage-check.png footage-candidates.png timing.json transcript.json voice-preview.mp3 "$(basename "$PROJECT").srt" description.md chapters.txt; do
            [ -f "projects/$PROJECT/$f" ] && git add "projects/$PROJECT/$f"
          done
          git add -u "projects/$PROJECT/media" 2>/dev/null || true
          git commit -m "Render run: footage, transcript and timings for $PROJECT" || echo "nothing new to commit"
          for i in 1 2 3; do git pull -q --rebase --autostash && git push && break || sleep 5; done

      - name: Upload the videos and storyboard
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick.outputs.project }}
          retention-days: 14
          path: |
            video-pipeline/projects/${{ steps.pick.outputs.project }}/*.mp4
            video-pipeline/projects/${{ steps.pick.outputs.project }}/storyboard.html
            video-pipeline/projects/${{ steps.pick.outputs.project }}/storyboard.json
            video-pipeline/projects/${{ steps.pick.outputs.project }}/footage-report.md
            video-pipeline/projects/${{ steps.pick.outputs.project }}/facts-report.md
            video-pipeline/projects/${{ steps.pick.outputs.project }}/credits.txt
            video-pipeline/projects/${{ steps.pick.outputs.project }}/footage-check.png
            video-pipeline/projects/${{ steps.pick.outputs.project }}/footage-candidates.png
            video-pipeline/projects/${{ steps.pick.outputs.project }}/.cache/transcript-*.json
            video-pipeline/projects/${{ steps.pick.outputs.project }}/script.md
      - name: Publish the videos as a release (downloadable without logging in to Actions)
        # a release can be refused on a manually dispatched run (403); the artifact above already holds the videos
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ steps.pick.outputs.project }}
        run: |
          tag="demo-$PROJECT"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Demo: $PROJECT" --notes "Rendered by the Render video workflow. See footage-report.md for every piece of footage and its licence." --target "${{ github.sha }}"
          # one file at a time, retried: replacing an asset sometimes answers HTTP 500 and the rest were never sent
          for f in projects/$PROJECT/*.mp4 projects/$PROJECT/*.srt projects/$PROJECT/footage-report.md projects/$PROJECT/storyboard.html; do
            [ -f "$f" ] || continue
            for i in 1 2 3 4; do
              gh release upload "$tag" "$f" --clobber && break
              echo "upload of $f failed (try $i), retrying"; sleep $((i * 5))
              gh release delete-asset "$tag" "$(basename "$f")" -y 2>/dev/null || true
            done
          done
          [ -f "projects/$PROJECT/facts-report.md" ] && gh release upload "$tag" "projects/$PROJECT/facts-report.md" --clobber || true
          [ -f "projects/$PROJECT/credits.txt" ] && gh release upload "$tag" "projects/$PROJECT/credits.txt" --clobber || true
          [ -f "projects/$PROJECT/footage-check.png" ] && gh release upload "$tag" "projects/$PROJECT/footage-check.png" --clobber || true
          [ -f "projects/$PROJECT/footage-candidates.png" ] && gh release upload "$tag" "projects/$PROJECT/footage-candidates.png" --clobber || true

  # The one-sheet version of a video: a single chart with a camera (remotion/src/sheet/Sheet.tsx), rendered in pieces
  # and laid under the sound of the project's published video. Run by hand with sheet=true.
  sheet:
    if: github.event.inputs.sheet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: video-pipeline
    env:
      PROJECT: ${{ github.event.inputs.project }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        timeout-minutes: 16
        run: bash scripts/install-ffmpeg.sh
      - name: Install
        run: cd remotion && npm ci && npx remotion browser ensure
      - name: Render the sheet in pieces and join them
        run: |
          mkdir -p remotion/public/sheet out
          cp "projects/$PROJECT/media/real-gov-isa.jpg" "projects/$PROJECT/media/real-gov-state-pension.jpg" remotion/public/sheet/
          cp "projects/$PROJECT/media/vuag-max-chart-app.mp4" remotion/public/sheet/vuag.mp4
          cd remotion
          N=12960; i=0; a=0
          while [ $a -lt $N ]; do
            b=$((a+1199)); [ $b -ge $N ] && b=$((N-1))
            f=../out/c$(printf %02d $i).mp4; ok=0
            for try in 1 2 3 4; do
              npx remotion render Sheet "$f" --frames=$a-$b --crf=18 --timeout=180000 --muted --log=error && [ -s "$f" ] && { ok=1; break; }
            done
            [ $ok = 1 ] || { echo "piece $i failed"; exit 1; }
            echo "file 'c$(printf %02d $i).mp4'" >> ../out/list.txt
            a=$((b+1)); i=$((i+1))
          done
          cd ../out && ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy silent.mp4
      - name: Add the published video's sound and publish
        run: |
          tag="demo-$PROJECT"
          gh release download "$tag" -p "$PROJECT.mp4" -D out
          ffmpeg -v error -y -i out/silent.mp4 -i "out/$PROJECT.mp4" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -af "afade=t=out:st=430:d=2" -movflags +faststart "out/$PROJECT-one-sheet.mp4"
          for attempt in 1 2 3 4 5; do gh release upload "$tag" "out/$PROJECT-one-sheet.mp4" --clobber && break; sleep 20; done
