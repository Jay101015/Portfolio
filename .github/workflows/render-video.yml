name: Render video

# Hosted rendering: push a project folder (script.md + voiceover + media) or
# run this workflow by hand with the project name, and GitHub's runner does the
# transcription, alignment and render. The finished videos are attached to
# the run as downloadable artifacts (kept 14 days).

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder under video-pipeline/projects"
        required: true
        default: "jurassic-park"
      vertical:
        description: "Also render the 9:16 version"
        type: boolean
        default: true
  push:
    paths:
      - "video-pipeline/projects/**/script.md"
      - "video-pipeline/projects/**/voiceover.*"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: video-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the project
        id: pick
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.project }}" ]; then
            echo "project=${{ github.event.inputs.project }}" >> "$GITHUB_OUTPUT"
          else
            # the most recently changed project folder in this push (before-sha may be unknown on a new branch)
            base="${{ github.event.before }}"
            git cat-file -e "$base" 2>/dev/null || base="HEAD~1"
            git cat-file -e "$base" 2>/dev/null || base="$(git hash-object -t tree /dev/null)"
            # of the projects touched by this push, the one whose last commit is newest
            p=""; newest=0
            for q in $(git diff --name-only "$base" HEAD -- . | sed -n 's#^video-pipeline/projects/\([^/]*\)/.*#\1#p' | sort -u); do
              t=$(git log -1 --format=%ct -- "video-pipeline/projects/$q" 2>/dev/null || echo 0)
              if [ "${t:-0}" -ge "$newest" ]; then newest=$t; p=$q; fi
            done
            echo "project=${p:-jurassic-park}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-pipeline/remotion/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-pipeline/requirements.txt

      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install
        run: |
          pip install -r requirements.txt yt-dlp
          cd remotion && npm ci && npx remotion browser ensure

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Find free-use footage for scenes that have none
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python -m pipeline.find_footage "projects/$PROJECT" || echo "footage finder failed; rendering with fallbacks"

      - name: Render
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
        run: |
          flags=""
          if [ "${{ github.event.inputs.vertical }}" != "false" ]; then flags="--vertical"; fi
          python -m pipeline.build "projects/$PROJECT" --model base.en --concurrency 2 $flags

      - name: Keep what the run found (script with credits, report, small media) on the branch
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          find "projects/$PROJECT/media" -type f -size -20M \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webm' -o -name '*.mp4' \) -exec git add -f {} +
          git add "projects/$PROJECT/script.md" "projects/$PROJECT/footage-report.md" 2>/dev/null || true
          git commit -m "Render run: footage found for $PROJECT" || echo "nothing new to commit"
          git push || echo "push skipped"

      - name: Publish the videos as a release (downloadable without logging in to Actions)
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ steps.pick.outputs.project }}
        run: |
          tag="demo-$PROJECT"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Demo: $PROJECT" --notes "Rendered by the Render video workflow. See footage-report.md for every piece of footage and its licence." --target "${{ github.sha }}"
          gh release upload "$tag" projects/$PROJECT/*.mp4 projects/$PROJECT/footage-report.md projects/$PROJECT/storyboard.html --clobber

      - name: Upload the videos and storyboard
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick.outputs.project }}
          retention-days: 14
          path: |
            video-pipeline/projects/${{ steps.pick.outputs.project }}/*.mp4
            video-pipeline/projects/${{ steps.pick.outputs.project }}/storyboard.html
            video-pipeline/projects/${{ steps.pick.outputs.project }}/storyboard.json
            video-pipeline/projects/${{ steps.pick.outputs.project }}/footage-report.md
            video-pipeline/projects/${{ steps.pick.outputs.project }}/.cache/transcript-*.json
            video-pipeline/projects/${{ steps.pick.outputs.project }}/script.md
