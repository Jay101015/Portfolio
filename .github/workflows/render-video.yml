name: Render video

# Hosted rendering: push a project folder (script.md + voiceover + media) or
# run this workflow by hand with the project name, and GitHub's runner does the
# transcription, alignment and render. The finished videos are attached to
# the run as downloadable artifacts (kept 14 days).

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder under video-pipeline/projects"
        required: true
        default: "jurassic-park"
      vertical:
        description: "Also render the 9:16 version"
        type: boolean
        default: true
  # a recording on its own is transcribed by transcribe.yml (minutes); the video is rendered when the script ships
  push:
    paths:
      - "video-pipeline/projects/**/script.md"
      - "video-pipeline/projects/**/shorts.json"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: video-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the project
        id: pick
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.project }}" ]; then
            echo "project=${{ github.event.inputs.project }}" >> "$GITHUB_OUTPUT"
          else
            # the most recently changed project folder in this push (before-sha may be unknown on a new branch)
            base="${{ github.event.before }}"
            git cat-file -e "$base" 2>/dev/null || base="HEAD~1"
            git cat-file -e "$base" 2>/dev/null || base="$(git hash-object -t tree /dev/null)"
            # of the projects touched by this push, the one whose last commit is newest
            p=""; newest=0
            for q in $(git diff --name-only "$base" HEAD -- . | sed -n 's#^video-pipeline/projects/\([^/]*\)/.*#\1#p' | sort -u); do
              t=$(git log -1 --format=%ct -- "video-pipeline/projects/$q" 2>/dev/null || echo 0)
              if [ "${t:-0}" -ge "$newest" ]; then newest=$t; p=$q; fi
            done
            echo "project=${p:-jurassic-park}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-pipeline/remotion/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-pipeline/requirements.txt

      - name: "System packages (apt with short timeouts and retries; it has hung for a quarter of an hour at a time)"
        timeout-minutes: 8
        run: |
          command -v ffmpeg >/dev/null && exit 0
          opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            timeout 150 sudo apt-get update -q $opts && break || echo "apt-get update attempt $i failed"
          done
          for i in 1 2 3; do
            timeout 240 sudo apt-get install -y -q --no-install-recommends $opts ffmpeg && break || echo "apt-get install attempt $i failed"
          done
          command -v ffmpeg

      - name: Install
        run: |
          pip install -r requirements.txt yt-dlp
          cd remotion && npm ci && npx remotion browser ensure

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Find free-use footage for scenes that have none
        timeout-minutes: 10
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m pipeline.find_footage "projects/$PROJECT" || echo "footage finder failed; rendering with fallbacks"

      - name: Fill in real figures and headlines (fact= on stat scenes, [news] scenes)
        timeout-minutes: 5
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
        run: python -m pipeline.find_facts "projects/$PROJECT" || echo "facts step failed; the board keeps what the script says"

      - name: Render
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
        run: |
          flags=""
          if [ "${{ github.event.inputs.vertical }}" != "false" ]; then flags="--vertical"; fi
          python -m pipeline.build "projects/$PROJECT" --model base.en --concurrency 2 $flags

      - name: Keep what the run found (script with credits, report, small media) on the branch
        env:
          PROJECT: ${{ steps.pick.outputs.project }}
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          # uploads from the studio arrive as <name>.b64 (big ones in pieces under uploads/); the build decoded them,
          # so keep the real file and drop the text copies
          git rm -r -q --ignore-unmatch "projects/$PROJECT/uploads" 2>/dev/null || true
          rm -rf "projects/$PROJECT/uploads"
          find "projects/$PROJECT/media" -name '*.b64' -exec git rm -q --ignore-unmatch {} + 2>/dev/null || true
          find "projects/$PROJECT/media" -name '*.b64' -delete 2>/dev/null || true
          find "projects/$PROJECT/media" -type f -size -40M \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.gif' -o -name '*.webp' -o -name '*.webm' -o -name '*.mp4' -o -name '*.mov' \) -exec git add -f {} +
          # a recording sent from the studio: keep the decoded voice (it replaced any older one), drop the text copy
          if ls "projects/$PROJECT"/voiceover.*.b64 >/dev/null 2>&1; then
            git rm -q --ignore-unmatch "projects/$PROJECT"/voiceover.*.b64
            rm -f "projects/$PROJECT"/voiceover.*.b64
            find "projects/$PROJECT" -maxdepth 1 -name 'voiceover.*' -size -40M -exec git add -f {} +
            git add -u "projects/$PROJECT" 2>/dev/null || true
          fi
          # the script (built from the voice when there was none), the transcript and the timings, for the studio
          # one at a time: a single missing file (no timing.json on a silent render) made git add refuse the lot,
          # and the script lost the footage and figures the run had written into it
          for f in script.md footage-report.md facts-report.md credits.txt timing.json transcript.json voice-preview.mp3; do
            [ -f "projects/$PROJECT/$f" ] && git add "projects/$PROJECT/$f"
          done
          git add -u "projects/$PROJECT/media" 2>/dev/null || true
          git commit -m "Render run: footage, transcript and timings for $PROJECT" || echo "nothing new to commit"
          for i in 1 2 3; do git pull -q --rebase --autostash && git push && break || sleep 5; done

      - name: Upload the videos and storyboard
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick.outputs.project }}
          retention-days: 14
          path: |
            video-pipeline/projects/${{ steps.pick.outputs.project }}/*.mp4
            video-pipeline/projects/${{ steps.pick.outputs.project }}/storyboard.html
            video-pipeline/projects/${{ steps.pick.outputs.project }}/storyboard.json
            video-pipeline/projects/${{ steps.pick.outputs.project }}/footage-report.md
            video-pipeline/projects/${{ steps.pick.outputs.project }}/facts-report.md
            video-pipeline/projects/${{ steps.pick.outputs.project }}/credits.txt
            video-pipeline/projects/${{ steps.pick.outputs.project }}/.cache/transcript-*.json
            video-pipeline/projects/${{ steps.pick.outputs.project }}/script.md
      - name: Publish the videos as a release (downloadable without logging in to Actions)
        # a release can be refused on a manually dispatched run (403); the artifact above already holds the videos
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ steps.pick.outputs.project }}
        run: |
          tag="demo-$PROJECT"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Demo: $PROJECT" --notes "Rendered by the Render video workflow. See footage-report.md for every piece of footage and its licence." --target "${{ github.sha }}"
          gh release upload "$tag" projects/$PROJECT/*.mp4 projects/$PROJECT/footage-report.md projects/$PROJECT/storyboard.html --clobber
          [ -f "projects/$PROJECT/facts-report.md" ] && gh release upload "$tag" "projects/$PROJECT/facts-report.md" --clobber || true
          [ -f "projects/$PROJECT/credits.txt" ] && gh release upload "$tag" "projects/$PROJECT/credits.txt" --clobber || true

